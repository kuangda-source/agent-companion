<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="597" viewBox="0 0 1280 597" role="img" aria-labelledby="title desc">
  <title id="title">上下文与记忆架构</title>
  <desc id="desc">读取游标和增量收件箱，经有限上下文、Mastra 模型调用与来源校验后提交。应用持有会话记忆、FTS5 历史事件、显式用户记忆和近期聊天，Letta 留作后续适配。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#111d33" />
      <stop offset="1" stop-color="#090f1c" />
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#5ee9dc" />
      <stop offset="1" stop-color="#b7a1ff" />
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6" fill="none" stroke="#72d9d5" stroke-width="1.4" />
    </marker>
  </defs>
  <rect width="1280" height="597" rx="24" fill="url(#bg)" />
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans CJK SC, sans-serif">
    <text x="34" y="43" fill="#79ddd6" font-size="16" font-weight="600">02  /  CONTEXT &amp; MEMORY</text>
    <text x="34" y="79" fill="#e8effa" font-size="28" font-weight="600">新消息更新对应记忆，旧结果按需找回</text>
    <rect x="34" y="118" width="279" height="154" rx="16" fill="#121f33" stroke="#2b3e59" />
    <text x="52" y="148" fill="#73dacf" font-size="15" font-weight="600">01</text>
    <text x="52" y="185" fill="#e7eef8" font-size="24" font-weight="600">读取游标</text>
    <text x="52" y="219" fill="#adc3dd" font-size="17" font-weight="400">顺序读取新增正文</text>
    <text x="52" y="246" fill="#adc3dd" font-size="17" font-weight="400">待处理增量入库</text>
    <rect x="345" y="118" width="279" height="154" rx="16" fill="#121f33" stroke="#2b3e59" />
    <text x="363" y="148" fill="#73dacf" font-size="15" font-weight="600">02</text>
    <text x="363" y="185" fill="#e7eef8" font-size="24" font-weight="600">组装有限上下文</text>
    <text x="363" y="219" fill="#adc3dd" font-size="17" font-weight="400">旧摘要 + 当前事实</text>
    <text x="363" y="246" fill="#adc3dd" font-size="17" font-weight="400">新片段 + 可引用来源</text>
    <rect x="656" y="118" width="279" height="154" rx="16" fill="#121f33" stroke="#2b3e59" />
    <text x="674" y="148" fill="#73dacf" font-size="15" font-weight="600">03</text>
    <text x="674" y="185" fill="#e7eef8" font-size="24" font-weight="600">Mastra 模型调用</text>
    <text x="674" y="219" fill="#adc3dd" font-size="17" font-weight="400">项目整理 / 文字追问</text>
    <text x="674" y="246" fill="#adc3dd" font-size="17" font-weight="400">统一预算与取消</text>
    <rect x="967" y="118" width="279" height="154" rx="16" fill="#121f33" stroke="#2b3e59" />
    <text x="985" y="148" fill="#73dacf" font-size="15" font-weight="600">04</text>
    <text x="985" y="185" fill="#e7eef8" font-size="24" font-weight="600">校验后再接受</text>
    <text x="985" y="219" fill="#adc3dd" font-size="17" font-weight="400">结构与来源校验</text>
    <text x="985" y="246" fill="#adc3dd" font-size="17" font-weight="400">成功后事务提交</text>
    <path d="M313 192 H345" stroke="#72d9d5" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    <path d="M624 192 H656" stroke="#72d9d5" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    <path d="M935 192 H967" stroke="#72d9d5" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    <path d="M1107 272 V303 H300 V328" stroke="#72d9d5" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    <text x="34" y="317" fill="#9eb7d5" font-size="19" font-weight="500">应用拥有的持久记忆</text>
    <rect x="34" y="337" width="384" height="123" rx="16" fill="#132136" stroke="#304764" />
    <text x="53" y="372" fill="#87e5d8" font-size="22" font-weight="600">会话工作记忆</text>
    <text x="53" y="408" fill="#b5c9df" font-size="18" font-weight="400">任务 / 结果 / 未解决问题</text>
    <text x="53" y="438" fill="#91a9c7" font-size="17" font-weight="400">摘要修订与来源证据</text>
    <rect x="448" y="337" width="384" height="123" rx="16" fill="#132136" stroke="#304764" />
    <text x="467" y="372" fill="#c4b5fd" font-size="22" font-weight="600">可检索历史事件</text>
    <text x="467" y="408" fill="#b5c9df" font-size="18" font-weight="400">SQLite FTS5 · 中文关键词</text>
    <text x="467" y="438" fill="#91a9c7" font-size="17" font-weight="400">按需召回，补入较新更正</text>
    <rect x="862" y="337" width="384" height="123" rx="16" fill="#132136" stroke="#304764" />
    <text x="881" y="372" fill="#99caff" font-size="22" font-weight="600">用户记忆与近期聊天</text>
    <text x="881" y="408" fill="#b5c9df" font-size="18" font-weight="400">显式保存偏好与人格设置</text>
    <text x="881" y="438" fill="#91a9c7" font-size="17" font-weight="400">Mastra 保存派生上下文镜像</text>
    <path d="M640 460 V486 H18 V292 H485 V272" stroke="#72d9d5" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5" />
    <path d="M418 397 H448" stroke="#72d9d5" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    <text x="34" y="530" fill="#9ddfd7" font-size="18" font-weight="400">推理失败：保留旧摘要和待处理增量  ·  搜索历史：本地检索，不额外调用模型</text>
    <text x="34" y="563" fill="#93aac7" font-size="17" font-weight="400">Letta 已预留引擎与记忆交接接口；完整运行时、长期语音与个性化适配仍在规划。</text>
  </g>
</svg>
