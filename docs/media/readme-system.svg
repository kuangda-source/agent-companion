<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="542" viewBox="0 0 1280 542" role="img" aria-labelledby="title desc">
  <title id="title">Agent Companion 整体架构</title>
  <desc id="desc">本机 Agent 只读采集到 Mac，DSH 事件核心、Mastra、SQLite 与音频队列协作；可选 API 提供模型与 TTS，USB、局域网或中转将状态及音频发送到 ESP32-P4。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#111d33" />
      <stop offset="1" stop-color="#090f1c" />
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#5ee9dc" />
      <stop offset="1" stop-color="#b7a1ff" />
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6" fill="none" stroke="#72d9d5" stroke-width="1.4" />
    </marker>
  </defs>
  <rect width="1280" height="542" rx="24" fill="url(#bg)" />
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans CJK SC, sans-serif">
    <text x="34" y="43" fill="#79ddd6" font-size="16" font-weight="600">01  /  SYSTEM ARCHITECTURE</text>
    <text x="34" y="79" fill="#e8effa" font-size="28" font-weight="600">采集与编排在 Mac，显示与播放在小屏</text>
    <rect x="34" y="128" width="214" height="296" rx="16" fill="#121f33" stroke="#2b3e59" />
    <text x="55" y="163" fill="#e8effa" font-size="22" font-weight="600">本机 Agent 来源</text>
    <circle cx="60" cy="200" r="4" fill="#8ea8cb" />
    <text x="75" y="207" fill="#b9cce3" font-size="18" font-weight="400">Codex</text>
    <circle cx="60" cy="245" r="4" fill="#8ea8cb" />
    <text x="75" y="252" fill="#b9cce3" font-size="18" font-weight="400">Grok Bot</text>
    <circle cx="60" cy="290" r="4" fill="#8ea8cb" />
    <text x="75" y="297" fill="#b9cce3" font-size="18" font-weight="400">DeepSeek Harness</text>
    <circle cx="60" cy="335" r="4" fill="#8ea8cb" />
    <text x="75" y="342" fill="#b9cce3" font-size="18" font-weight="400">Claude Code</text>
    <text x="55" y="397" fill="#79ddd6" font-size="16" font-weight="400">只读记录与可读状态</text>
    <rect x="296" y="128" width="582" height="296" rx="16" fill="#122238" stroke="#365572" />
    <text x="320" y="164" fill="#e8effa" font-size="23" font-weight="600">Mac App + Local Gateway</text>
    <rect x="320" y="190" width="250" height="77" rx="10" fill="#0e1a2b" stroke="#2b425d" />
    <text x="336" y="219" fill="#75e0d6" font-size="19" font-weight="600">事件观察 / DSH Core</text>
    <text x="336" y="246" fill="#adc0d8" font-size="16" font-weight="400">合批、队列与持久化</text>
    <rect x="594" y="190" width="260" height="77" rx="10" fill="#0e1a2b" stroke="#2b425d" />
    <text x="610" y="219" fill="#c4b5fd" font-size="19" font-weight="600">Mastra + Model Gateway</text>
    <text x="610" y="246" fill="#adc0d8" font-size="16" font-weight="400">简报、追问与调用预算</text>
    <rect x="320" y="286" width="250" height="77" rx="10" fill="#0e1a2b" stroke="#2b425d" />
    <text x="336" y="315" fill="#c4b5fd" font-size="19" font-weight="600">应用记忆 / SQLite</text>
    <text x="336" y="342" fill="#adc0d8" font-size="16" font-weight="400">会话事实 · FTS5 · 用户偏好</text>
    <rect x="594" y="286" width="260" height="77" rx="10" fill="#0e1a2b" stroke="#2b425d" />
    <text x="610" y="315" fill="#75e0d6" font-size="19" font-weight="600">通知与音频队列</text>
    <text x="610" y="342" fill="#adc0d8" font-size="16" font-weight="400">去重 · TTS · 设备回执</text>
    <text x="321" y="398" fill="#9fb5d1" font-size="17" font-weight="400">SwiftUI · Bun / TypeScript · 共享 LVGL 预览</text>
    <rect x="936" y="128" width="310" height="112" rx="16" fill="#1d2038" stroke="#514776" />
    <text x="958" y="162" fill="#d2c6ff" font-size="22" font-weight="600">可选云端服务</text>
    <text x="958" y="192" fill="#bac6de" font-size="17" font-weight="400">LLM API  /  百炼 TTS</text>
    <text x="958" y="218" fill="#93a9c6" font-size="16" font-weight="400">Key 只保存在 Mac</text>
    <rect x="936" y="280" width="310" height="144" rx="16" fill="#102a32" stroke="#346b70" />
    <text x="958" y="315" fill="#93f1df" font-size="22" font-weight="600">ESP32-P4 桌面屏</text>
    <text x="958" y="347" fill="#c1d7e2" font-size="17" font-weight="400">LVGL 界面 · 触摸 · 动态桌宠</text>
    <text x="958" y="376" fill="#c1d7e2" font-size="17" font-weight="400">I²S 音频 → ES8311 → 扬声器</text>
    <text x="958" y="403" fill="#8dbbbf" font-size="16" font-weight="400">ESP32-C6 提供 Wi-Fi</text>
    <path d="M248 266 H296" stroke="#72d9d5" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    <path d="M878 184 H936" stroke="#72d9d5" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    <path d="M936 206 H902 V218 H878" stroke="#72d9d5" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5" />
    <path d="M878 350 H936" stroke="#72d9d5" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    <text x="34" y="475" fill="#9ddfd7" font-size="19" font-weight="500">USB 优先  ·  局域网 WSS  ·  自建 WSS 中转</text>
    <text x="34" y="507" fill="#93aac7" font-size="17" font-weight="400">中转转发状态与音频；模型密钥不发往中转或设备。</text>
  </g>
</svg>
